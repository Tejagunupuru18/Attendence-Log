<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>TimeFlow Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container": "#edeeef",
                    "tertiary-container": "#00473b",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#c7c5d4",
                    "on-secondary-fixed-variant": "#004493",
                    "secondary-fixed": "#d8e2ff",
                    "background": "#f8f9fa",
                    "surface-variant": "#e1e3e4",
                    "on-primary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-surface": "#191c1d",
                    "tertiary": "#002f26",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#373a9b",
                    "on-primary-fixed": "#04006d",
                    "error": "#ba1a1a",
                    "surface": "#f8f9fa",
                    "primary-container": "#2e3192",
                    "secondary-container": "#0070ea",
                    "inverse-primary": "#c0c1ff",
                    "on-error-container": "#93000a",
                    "on-background": "#191c1d",
                    "on-tertiary-fixed-variant": "#005143",
                    "surface-container-highest": "#e1e3e4",
                    "primary-fixed-dim": "#c0c1ff",
                    "on-primary-container": "#9da1ff",
                    "on-tertiary-container": "#00bfa2",
                    "secondary-fixed-dim": "#adc7ff",
                    "outline": "#777683",
                    "error-container": "#ffdad6",
                    "secondary": "#0059bb",
                    "surface-tint": "#4f54b4",
                    "primary": "#15157d",
                    "tertiary-fixed-dim": "#2cdebf",
                    "on-secondary-fixed": "#001a41",
                    "on-surface-variant": "#464652",
                    "surface-bright": "#f8f9fa",
                    "on-error": "#ffffff",
                    "surface-container-low": "#f3f4f5",
                    "surface-dim": "#d9dadb",
                    "tertiary-fixed": "#58fbda",
                    "inverse-surface": "#2e3132",
                    "inverse-on-surface": "#f0f1f2",
                    "surface-container-high": "#e7e8e9",
                    "on-secondary-container": "#fefcff",
                    "primary-fixed": "#e1e0ff",
                    "on-tertiary-fixed": "#00201a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "16px",
                    "sm": "8px",
                    "margin-mobile": "16px",
                    "xs": "4px",
                    "base": "4px",
                    "lg": "24px",
                    "xl": "32px",
                    "gutter": "12px",
                    "margin-desktop": "40px"
            },
            "fontFamily": {
                    "label-md": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"],
                    "display-lg-mobile": ["Plus Jakarta Sans"],
                    "headline-sm": ["Plus Jakarta Sans"],
                    "display-lg": ["Plus Jakarta Sans"],
                    "label-sm": ["Hanken Grotesk"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "body-lg": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "display-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "800"}],
                    "headline-sm": ["20px", {"lineHeight": "1.4", "fontWeight": "700"}],
                    "display-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.5", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
    <style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-pulse {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(21, 21, 125, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(21, 21, 125, 0); }
            100% { box-shadow: 0 0 0 0 rgba(21, 21, 125, 0); }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24">
    <!-- TopAppBar -->
    <header class="w-full top-0 sticky z-40 bg-background/90 backdrop-blur-md flex justify-between items-center px-margin-mobile py-sm">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-2xl">school</span>
            <h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">TimeFlow</h1>
        </div>
        <div class="flex items-center gap-3">
            <a href="export.html" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center active:scale-90 transition-all">
                <span class="material-symbols-outlined text-primary text-[20px]">download</span>
            </a>
            <div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-label-sm">TF</div>
        </div>
    </header>

    <main class="px-margin-mobile pt-sm space-y-lg">
        <!-- Live Clock + Welcome -->
        <section class="bg-surface-container-lowest rounded-2xl p-lg shadow-[0_4px_20px_rgba(21,21,125,0.06)] flex flex-col gap-xs">
            <div id="live-clock" class="flex flex-col gap-xs">
                <!-- Populated by renderClock() -->
            </div>
            <p class="font-body-md text-on-surface-variant mt-1">Have a productive day! 🎓</p>
        </section>

        <!-- Current Status: Today's Schedule -->
        <section id="next-class-card" class="relative overflow-hidden rounded-xl bg-primary shadow-lg p-lg text-on-primary">
            <!-- Loading placeholder state -->
            <div class="absolute top-0 right-0 p-4 opacity-10">
                <span class="material-symbols-outlined text-[120px]">schedule</span>
            </div>
            <div class="relative z-10 space-y-md">
                <div class="flex justify-between items-start">
                    <span class="bg-primary-container text-on-primary-container px-3 py-1 rounded-full font-label-sm text-label-sm">Next Class</span>
                    <div id="countdown-badge" class="flex items-center gap-1 text-primary-fixed-dim active-pulse px-2 py-1 rounded-lg">
                        <span class="w-2 h-2 rounded-full bg-primary-fixed-dim"></span>
                        <span class="font-label-md text-label-md">Today's Schedule</span>
                    </div>
                </div>
                <div>
                    <h3 id="next-class-name" class="font-headline-md text-headline-md">Loading schedule...</h3>
                    <p id="next-class-details" class="font-body-md opacity-90"></p>
                </div>
                <div class="flex items-center gap-4 pt-2">
                    <a href="timetable.html" class="bg-primary-fixed text-primary font-label-md px-4 py-2 rounded-lg flex items-center gap-2 hover:opacity-90 transition-opacity">
                        <span class="material-symbols-outlined text-[18px]">calendar_today</span>
                        View Full Timetable
                    </a>
                </div>
            </div>
        </section>

        <!-- Attendance Summary -->
        <section class="space-y-sm">
            <h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Academic Standing</h3>
            <div class="grid grid-cols-2 gap-gutter">
                <!-- Attendance Card -->
                <div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_4px_20px_rgba(21,21,125,0.04)] flex flex-col items-center text-center space-y-sm">
                    <div class="relative w-16 h-16">
                        <svg class="w-full h-full" viewBox="0 0 36 36">
                            <path class="text-surface-variant stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-width="3"></path>
                            <path id="attendance-ring" class="text-tertiary stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-dasharray="0, 100" stroke-linecap="round" stroke-width="3"></path>
                        </svg>
                        <div id="attendance-pct" class="absolute inset-0 flex items-center justify-center font-label-md text-primary">0%</div>
                    </div>
                    <div>
                        <p class="font-label-sm text-label-sm text-on-surface">Attendance</p>
                        <p id="attendance-status" class="font-label-sm text-label-sm text-on-tertiary-container">Calculating...</p>
                    </div>
                </div>
                <!-- Bunk Card -->
                <div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_4px_20px_rgba(21,21,125,0.04)] flex flex-col items-center text-center justify-center space-y-xs">
                    <div id="bunk-count" class="bg-tertiary-fixed/20 text-tertiary px-3 py-1 rounded-full font-headline-md">0</div>
                    <div>
                        <p class="font-label-sm text-label-sm text-on-surface">Safe Bunks</p>
                        <p class="font-label-sm text-label-sm text-on-surface-variant">Available</p>
                    </div>
                </div>
            </div>
        </section>


        <!-- Upcoming Classes -->
        <section class="space-y-md">
            <div class="flex justify-between items-center">
                <h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Upcoming Today</h3>
                <a href="timetable.html" class="text-primary font-label-md hover:underline">View All</a>
            </div>
            <div id="upcoming-list" class="space-y-sm">
                <!-- Dynamically loaded -->
                <p class="text-center py-4 text-on-surface-variant text-body-md">No classes remaining today.</p>
            </div>
        </section>
    </main>

    <!-- JS Scripts -->
    <script src="app.js"></script>
    <script>
        // Set Active Nav Tab
        renderGlobalNavbar('home');

        // Start live clock
        renderClock('live-clock');

        // ── Helpers ──────────────────────────────────────────────────
        const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const DAY_FULL  = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

        function toMinutes(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.trim().split(' ');
            const tp = parts[0].split(':');
            let h = parseInt(tp[0]), m = parseInt(tp[1]);
            const pm = parts[1] && parts[1].toLowerCase() === 'pm';
            if (pm && h !== 12) h += 12;
            if (!pm && h === 12) h = 0;
            return h * 60 + m;
        }

        function nowMinutes() {
            const n = new Date();
            return n.getHours() * 60 + n.getMinutes();
        }

        // Find the next upcoming class across the whole week
        // Returns { cls, daysFromNow, minutesFromNow } or null
        function findNextClass(timetable) {
            if (!timetable.length) return null;
            const now     = new Date();
            const todayIdx = now.getDay(); // 0=Sun
            const nowMins  = nowMinutes();

            // Check up to 7 days ahead
            for (let d = 0; d < 7; d++) {
                const dayIdx = (todayIdx + d) % 7;
                const dayStr = DAY_NAMES[dayIdx];
                const dayClasses = timetable
                    .filter(c => c.day === dayStr)
                    .sort((a,b) => toMinutes(a.startTime) - toMinutes(b.startTime));

                for (const cls of dayClasses) {
                    const startMins = toMinutes(cls.startTime);
                    if (d === 0 && startMins <= nowMins) continue; // already started today
                    return { cls, daysFromNow: d, minutesFromNow: d === 0 ? startMins - nowMins : null };
                }
            }
            return null;
        }

        function formatCountdown(daysFromNow, minutesFromNow, cls) {
            if (daysFromNow === 0 && minutesFromNow !== null) {
                if (minutesFromNow <= 0)   return { text: 'Starting now!', pulse: true };
                if (minutesFromNow < 60)   return { text: `Starts in ${minutesFromNow} min`, pulse: true };
                const hrs = Math.floor(minutesFromNow / 60);
                const mins = minutesFromNow % 60;
                return { text: `Starts in ${hrs}h ${mins > 0 ? mins + 'm' : ''}`.trim(), pulse: true };
            }
            if (daysFromNow === 1) return { text: `Tomorrow · ${cls.startTime}`, pulse: false };
            return { text: `${DAY_FULL[(new Date().getDay() + daysFromNow) % 7]} · ${cls.startTime}`, pulse: false };
        }

        // ── Main dashboard loader ─────────────────────────────────────
        function loadDashboard() {
            // ── Attendance standing ───────────────────────────────────
            const attendance = AttendanceManager.getAttendance();
            let totalAttended = 0, totalClasses = 0, bunkableCount = 0;

            attendance.forEach(subject => {
                totalAttended += subject.attended;
                totalClasses  += subject.total;
                const pct = subject.required / 100;
                if (subject.total > 0) {
                    const currentPct = subject.attended / subject.total;
                    if (currentPct >= pct) {
                        const maxBunks = Math.floor(subject.attended / pct) - subject.total;
                        if (maxBunks > 0) bunkableCount += maxBunks;
                    }
                }
            });

            const avgPct = totalClasses > 0 ? Math.round((totalAttended / totalClasses) * 100) : 0;
            document.getElementById('attendance-pct').innerText = totalClasses > 0 ? `${avgPct}%` : '--';
            document.getElementById('attendance-ring').setAttribute('stroke-dasharray', `${avgPct}, 100`);

            const attendanceStatus = document.getElementById('attendance-status');
            if (totalClasses === 0) {
                attendanceStatus.innerText = "No data yet";
                attendanceStatus.className = "font-label-sm text-label-sm text-on-surface-variant";
            } else if (avgPct >= 75) {
                attendanceStatus.innerText = "Safe Margin";
                attendanceStatus.className = "font-label-sm text-label-sm text-on-tertiary-container";
            } else {
                attendanceStatus.innerText = "Low Attendance!";
                attendanceStatus.className = "font-label-sm text-label-sm text-error font-bold";
            }
            document.getElementById('bunk-count').innerText = bunkableCount;

            // ── Today's classes ───────────────────────────────────────
            const timetable  = TimetableManager.getClasses();
            const todayStr   = DAY_NAMES[new Date().getDay()];
            const nowMins    = nowMinutes();

            // All today's classes sorted
            const todayAll = timetable
                .filter(c => c.day === todayStr)
                .sort((a,b) => toMinutes(a.startTime) - toMinutes(b.startTime));

            // Split into ongoing/upcoming vs finished
            const remaining = todayAll.filter(c => toMinutes(c.endTime || c.startTime) > nowMins);
            const finished  = todayAll.filter(c => toMinutes(c.endTime || c.startTime) <= nowMins);

            // ── Next class card ───────────────────────────────────────
            const nextClassCardName = document.getElementById('next-class-name');
            const nextClassDetails  = document.getElementById('next-class-details');
            const countdownBadge    = document.getElementById('countdown-badge');

            const nextResult = findNextClass(timetable);

            if (nextResult) {
                const { cls, daysFromNow, minutesFromNow } = nextResult;
                const cd = formatCountdown(daysFromNow, minutesFromNow, cls);
                nextClassCardName.innerText = cls.subject;
                nextClassDetails.innerText  = cls.startTime + ' – ' + cls.endTime;
                countdownBadge.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-primary-fixed-dim ${cd.pulse ? 'animate-pulse' : ''}"></span>
                    <span class="font-label-md text-label-md">${cd.text}</span>`;
            } else if (timetable.length === 0) {
                nextClassCardName.innerText = "No classes added yet";
                nextClassDetails.innerText  = "Go to Schedule to add your classes";
                countdownBadge.innerHTML    = `<span class="font-label-md text-label-md">Setup needed</span>`;
            } else {
                nextClassCardName.innerText = "All done for the week!";
                nextClassDetails.innerText  = "No more classes this week";
                countdownBadge.innerHTML    = `<span class="font-label-md text-label-md">Free time 🎉</span>`;
            }

            // ── Upcoming list (today only) ────────────────────────────
            const upcomingList = document.getElementById('upcoming-list');

            if (todayAll.length === 0) {
                // No classes today — show next class day info
                const next = findNextClass(timetable);
                if (next) {
                    const dayName = DAY_FULL[(new Date().getDay() + next.daysFromNow) % 7];
                    upcomingList.innerHTML = `
                        <div class="flex flex-col items-center py-6 gap-sm text-center text-on-surface-variant">
                            <span class="material-symbols-outlined text-4xl">event</span>
                            <p class="font-label-md">No classes today.</p>
                            <p class="font-label-sm">Next class: <span class="text-primary font-bold">${next.cls.subject}</span> on <span class="font-bold">${dayName}</span> at ${next.cls.startTime}</p>
                        </div>`;
                } else {
                    upcomingList.innerHTML = `<p class="text-center py-6 text-on-surface-variant text-body-md">No classes scheduled.</p>`;
                }
                return;
            }

            // Render all today's classes — mark status
            upcomingList.innerHTML = todayAll.map(c => {
                const startMins = toMinutes(c.startTime);
                const endMins   = toMinutes(c.endTime || c.startTime);
                const isOngoing = startMins <= nowMins && endMins > nowMins;
                const isDone    = endMins <= nowMins;
                const isNext    = !isDone && !isOngoing && remaining[0]?.subject === c.subject && remaining[0]?.startTime === c.startTime;

                const borderCol = c.color === 'secondary' ? 'border-secondary'
                                : c.color === 'tertiary'  ? 'border-tertiary'
                                : c.color === 'error'     ? 'border-error'
                                : 'border-primary';

                let badge = '';
                if (isOngoing) badge = `<span class="px-2 py-0.5 bg-secondary text-on-secondary rounded-full font-label-sm text-label-sm animate-pulse">In Progress</span>`;
                else if (isNext) {
                    const minsLeft = startMins - nowMins;
                    const label = minsLeft < 60 ? `in ${minsLeft}m` : `in ${Math.floor(minsLeft/60)}h ${minsLeft%60>0?minsLeft%60+'m':''}`.trim();
                    badge = `<span class="px-2 py-0.5 bg-primary-container text-on-primary-container rounded-full font-label-sm text-label-sm">${label}</span>`;
                } else if (isDone) {
                    badge = `<span class="px-2 py-0.5 bg-surface-container text-on-surface-variant rounded-full font-label-sm text-label-sm">Done</span>`;
                }

                return `
                <div class="bg-white rounded-xl p-md flex items-center gap-md shadow-[0_4px_20px_rgba(21,21,125,0.04)] border-l-4 ${borderCol} ${isDone ? 'opacity-50' : ''}">
                    <div class="flex flex-col items-center min-w-[52px]">
                        <span class="font-label-md text-primary font-semibold">${c.startTime.split(' ')[0]}</span>
                        <span class="font-label-sm text-on-surface-variant">${c.startTime.split(' ')[1]}</span>
                    </div>
                    <div class="flex-grow">
                        <h4 class="font-headline-sm text-headline-sm text-on-surface font-bold">${c.subject}</h4>
                        <p class="font-label-sm text-on-surface-variant">${c.startTime} – ${c.endTime}</p>
                    </div>
                    ${badge}
                </div>`;
            }).join('');
        }

        // Reload every minute so countdowns stay fresh
        window.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            setInterval(loadDashboard, 60000);
        });
    </script>
</body>
</html>
