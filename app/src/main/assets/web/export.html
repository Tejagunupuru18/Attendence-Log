<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
    <title>TimeFlow - Export</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode:"class",
            theme:{extend:{
                colors:{
                    "surface-container":"#edeeef","background":"#f8f9fa","surface-variant":"#e1e3e4",
                    "on-primary":"#ffffff","surface-container-lowest":"#ffffff","on-surface":"#191c1d",
                    "tertiary":"#002f26","on-secondary":"#ffffff","error":"#ba1a1a",
                    "primary-container":"#2e3192","secondary-container":"#0070ea",
                    "on-background":"#191c1d","outline-variant":"#c7c5d4","outline":"#777683",
                    "error-container":"#ffdad6","on-error-container":"#93000a","secondary":"#0059bb",
                    "primary":"#15157d","on-surface-variant":"#464652","surface-container-low":"#f3f4f5",
                    "tertiary-fixed":"#58fbda","on-tertiary-fixed":"#00201a","on-tertiary-container":"#00bfa2",
                    "primary-fixed":"#e1e0ff","on-primary-fixed":"#04006d","on-error":"#ffffff",
                    "surface-container-high":"#e7e8e9","on-secondary-container":"#fefcff",
                    "secondary-fixed":"#d8e2ff","on-secondary-fixed":"#001a41",
                    "primary-fixed-dim":"#c0c1ff","on-primary-container":"#9da1ff",
                    "tertiary-container":"#00473b","on-tertiary":"#ffffff",
                    "on-primary-fixed-variant":"#373a9b"
                },
                borderRadius:{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},
                spacing:{"base":"4px","sm":"8px","md":"16px","xs":"4px","margin-mobile":"16px","gutter":"12px","xl":"32px","lg":"24px"},
                fontFamily:{"headline-sm":["Plus Jakarta Sans"],"display-lg-mobile":["Plus Jakarta Sans"],"body-md":["Hanken Grotesk"],"display-lg":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"label-sm":["Hanken Grotesk"],"body-lg":["Hanken Grotesk"],"label-md":["Hanken Grotesk"]},
                fontSize:{
                    "headline-sm":["20px",{"lineHeight":"1.4","fontWeight":"700"}],
                    "display-lg-mobile":["28px",{"lineHeight":"1.2","fontWeight":"800"}],
                    "body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],
                    "display-lg":["32px",{"lineHeight":"1.2","letterSpacing":"-0.02em","fontWeight":"800"}],
                    "headline-md":["24px",{"lineHeight":"1.3","fontWeight":"700"}],
                    "label-sm":["12px",{"lineHeight":"1.2","fontWeight":"700"}],
                    "body-lg":["18px",{"lineHeight":"1.5","fontWeight":"400"}],
                    "label-md":["14px",{"lineHeight":"1.2","letterSpacing":"0.01em","fontWeight":"600"}]
                }
            }}
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }

        /* Print styles — only the preview content prints */
        @media print {
            body * { visibility: hidden; }
            #print-preview, #print-preview * { visibility: visible; }
            #print-preview {
                position: fixed; top: 0; left: 0; width: 100%;
                font-family: 'Hanken Grotesk', sans-serif;
                padding: 24px;
            }
            .no-print { display: none !important; }
        }
        .export-card { transition: transform 0.15s, box-shadow 0.15s; }
        .export-card:active { transform: scale(0.97); }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen pb-32">

    <!-- Header -->
    <header class="w-full top-0 sticky z-40 bg-background/90 backdrop-blur-md flex items-center gap-sm px-margin-mobile py-sm border-b border-surface-variant/30 no-print">
        <a href="dashboard.html" class="material-symbols-outlined text-on-surface-variant">arrow_back</a>
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">download</span>
            <h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">Export</h1>
        </div>
    </header>

    <main class="px-margin-mobile pt-md space-y-md pb-4 no-print">
        <p class="font-label-md text-on-surface-variant">Choose what to export. Each report opens a print-ready view.</p>

        <!-- Export cards -->
        <div class="space-y-sm">

            <!-- Timetable -->
            <button onclick="exportTimetable()" class="export-card w-full bg-surface-container-lowest rounded-2xl border border-surface-variant/40 shadow-sm p-md flex items-center gap-md text-left">
                <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center flex-shrink-0">
                    <span class="material-symbols-outlined text-on-primary text-2xl">calendar_view_week</span>
                </div>
                <div class="flex-1">
                    <p class="font-headline-sm text-on-surface font-bold">Weekly Timetable</p>
                    <p class="font-label-sm text-on-surface-variant">All subjects · day · time</p>
                </div>
                <span class="material-symbols-outlined text-outline">print</span>
            </button>

            <!-- Attendance Report -->
            <button onclick="exportAttendance()" class="export-card w-full bg-surface-container-lowest rounded-2xl border border-surface-variant/40 shadow-sm p-md flex items-center gap-md text-left">
                <div class="w-12 h-12 rounded-xl bg-secondary flex items-center justify-center flex-shrink-0">
                    <span class="material-symbols-outlined text-on-secondary text-2xl">query_stats</span>
                </div>
                <div class="flex-1">
                    <p class="font-headline-sm text-on-surface font-bold">Attendance Report</p>
                    <p class="font-label-sm text-on-surface-variant">Per subject · % · status</p>
                </div>
                <span class="material-symbols-outlined text-outline">print</span>
            </button>

            <!-- Notes -->
            <button onclick="exportNotes()" class="export-card w-full bg-surface-container-lowest rounded-2xl border border-surface-variant/40 shadow-sm p-md flex items-center gap-md text-left">
                <div class="w-12 h-12 rounded-xl bg-tertiary flex items-center justify-center flex-shrink-0">
                    <span class="material-symbols-outlined text-on-tertiary text-2xl">description</span>
                </div>
                <div class="flex-1">
                    <p class="font-headline-sm text-on-surface font-bold">Notes</p>
                    <p class="font-label-sm text-on-surface-variant">All folders · all notes</p>
                </div>
                <span class="material-symbols-outlined text-outline">print</span>
            </button>

            <!-- Full Report -->
            <button onclick="exportAll()" class="export-card w-full bg-primary rounded-2xl shadow-md p-md flex items-center gap-md text-left">
                <div class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center flex-shrink-0">
                    <span class="material-symbols-outlined text-primary text-2xl">summarize</span>
                </div>
                <div class="flex-1">
                    <p class="font-headline-sm text-on-primary font-bold">Full Academic Report</p>
                    <p class="font-label-sm text-primary-fixed-dim">Everything in one print</p>
                </div>
                <span class="material-symbols-outlined text-on-primary">print</span>
            </button>
        </div>
    </main>

    <!-- Print preview area (hidden on screen, shown when printing) -->
    <div id="print-preview" class="hidden"></div>

    <script src="app.js"></script>
    <script>
        renderGlobalNavbar('home');

        const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

        function printHTML(html) {
            const prev = document.getElementById('print-preview');
            prev.innerHTML = html;
            prev.classList.remove('hidden');
            setTimeout(() => {
                window.print();
                prev.classList.add('hidden');
                prev.innerHTML = '';
            }, 300);
        }

        function headerBlock(title) {
            const now = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
            return `
            <div style="border-bottom:2px solid #15157d;padding-bottom:12px;margin-bottom:20px;">
                <h1 style="font-size:24px;font-weight:800;color:#15157d;margin:0">TimeFlow — ${title}</h1>
                <p style="font-size:12px;color:#777683;margin:4px 0 0">Generated on ${now}</p>
            </div>`;
        }

        // ── Timetable export ─────────────────────────────────────────
        function exportTimetable() {
            const classes = TimetableManager.getClasses();
            if (!classes.length) { alert('No classes added yet.'); return; }

            let rows = DAYS.map(day => {
                const dayClasses = classes
                    .filter(c => c.day === day)
                    .sort((a,b) => a.startTime.localeCompare(b.startTime));
                if (!dayClasses.length) return '';
                return dayClasses.map(c => `
                    <tr>
                        <td style="padding:8px 10px;font-weight:700;color:#15157d;border-bottom:1px solid #e1e3e4">${c.day}</td>
                        <td style="padding:8px 10px;border-bottom:1px solid #e1e3e4">${c.subject}</td>
                        <td style="padding:8px 10px;color:#464652;border-bottom:1px solid #e1e3e4">${c.startTime}</td>
                        <td style="padding:8px 10px;color:#464652;border-bottom:1px solid #e1e3e4">${c.endTime}</td>
                    </tr>`).join('');
            }).join('');

            printHTML(`
                ${headerBlock('Weekly Timetable')}
                <table style="width:100%;border-collapse:collapse;font-family:sans-serif;font-size:13px;">
                    <thead>
                        <tr style="background:#15157d;color:#fff;">
                            <th style="padding:10px;text-align:left">Day</th>
                            <th style="padding:10px;text-align:left">Subject</th>
                            <th style="padding:10px;text-align:left">Start</th>
                            <th style="padding:10px;text-align:left">End</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`);
        }

        // ── Attendance export ─────────────────────────────────────────
        function exportAttendance() {
            const attendance = AttendanceManager.getAttendance();
            if (!attendance.length) { alert('No attendance data yet.'); return; }

            const rows = attendance.map(a => {
                const pct    = a.total > 0 ? Math.round((a.attended / a.total) * 100) : 0;
                const status = pct >= a.required ? '✅ Safe' : '🚨 At Risk';
                const color  = pct >= a.required ? '#00473b' : '#ba1a1a';
                return `
                <tr>
                    <td style="padding:8px 10px;font-weight:700;border-bottom:1px solid #e1e3e4">${a.subject}</td>
                    <td style="padding:8px 10px;border-bottom:1px solid #e1e3e4;text-align:center">${a.attended}</td>
                    <td style="padding:8px 10px;border-bottom:1px solid #e1e3e4;text-align:center">${a.total}</td>
                    <td style="padding:8px 10px;border-bottom:1px solid #e1e3e4;text-align:center;font-weight:700;color:${color}">${pct}%</td>
                    <td style="padding:8px 10px;border-bottom:1px solid #e1e3e4;text-align:center">${a.required}%</td>
                    <td style="padding:8px 10px;border-bottom:1px solid #e1e3e4;color:${color};font-weight:700">${status}</td>
                </tr>`;
            }).join('');

            const totalAttended = attendance.reduce((s,a) => s + a.attended, 0);
            const totalHeld     = attendance.reduce((s,a) => s + a.total, 0);
            const overallPct    = totalHeld > 0 ? Math.round((totalAttended / totalHeld) * 100) : 0;

            printHTML(`
                ${headerBlock('Attendance Report')}
                <p style="font-size:13px;margin-bottom:16px;color:#464652">Overall: <strong>${totalAttended}/${totalHeld} classes (${overallPct}%)</strong></p>
                <table style="width:100%;border-collapse:collapse;font-family:sans-serif;font-size:13px;">
                    <thead>
                        <tr style="background:#15157d;color:#fff;">
                            <th style="padding:10px;text-align:left">Subject</th>
                            <th style="padding:10px;text-align:center">Attended</th>
                            <th style="padding:10px;text-align:center">Total</th>
                            <th style="padding:10px;text-align:center">%</th>
                            <th style="padding:10px;text-align:center">Min Req</th>
                            <th style="padding:10px;text-align:left">Status</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`);
        }

        // ── Notes export ─────────────────────────────────────────────
        function exportNotes() {
            const folders = NotesManager.getFolders();
            if (!folders.length) { alert('No notes added yet.'); return; }

            const content = folders.map(f => {
                const notes = f.notes.map(n => `
                    <div style="margin-bottom:12px;padding:10px;border:1px solid #e1e3e4;border-radius:8px;">
                        <p style="font-weight:700;margin:0 0 4px;font-size:13px">${n.title}</p>
                        <p style="margin:0;font-size:12px;color:#464652;white-space:pre-wrap">${n.content}</p>
                        <p style="margin:4px 0 0;font-size:10px;color:#777683">${n.updatedTime}</p>
                    </div>`).join('');
                return `
                    <div style="margin-bottom:20px;">
                        <h3 style="font-size:16px;font-weight:700;color:#15157d;border-bottom:1px solid #c7c5d4;padding-bottom:4px;margin-bottom:10px">
                            📁 ${f.name} (${f.notes.length} notes)
                        </h3>
                        ${notes || '<p style="font-size:12px;color:#777683">No notes in this folder.</p>'}
                    </div>`;
            }).join('');

            printHTML(`${headerBlock('Notes')}${content}`);
        }

        // ── Full report ───────────────────────────────────────────────
        function exportAll() {
            const classes    = TimetableManager.getClasses();
            const attendance = AttendanceManager.getAttendance();
            const folders    = NotesManager.getFolders();

            // Timetable table
            let ttRows = DAYS.flatMap(day =>
                classes.filter(c => c.day === day)
                       .sort((a,b) => a.startTime.localeCompare(b.startTime))
                       .map(c => `<tr>
                            <td style="padding:6px 8px;font-weight:700;border-bottom:1px solid #e1e3e4">${c.day}</td>
                            <td style="padding:6px 8px;border-bottom:1px solid #e1e3e4">${c.subject}</td>
                            <td style="padding:6px 8px;color:#464652;border-bottom:1px solid #e1e3e4">${c.startTime} – ${c.endTime}</td>
                        </tr>`)
            ).join('');

            // Attendance table
            let attRows = attendance.map(a => {
                const pct   = a.total > 0 ? Math.round((a.attended / a.total) * 100) : 0;
                const color = pct >= a.required ? '#00473b' : '#ba1a1a';
                return `<tr>
                    <td style="padding:6px 8px;font-weight:700;border-bottom:1px solid #e1e3e4">${a.subject}</td>
                    <td style="padding:6px 8px;text-align:center;border-bottom:1px solid #e1e3e4">${a.attended}/${a.total}</td>
                    <td style="padding:6px 8px;text-align:center;font-weight:700;color:${color};border-bottom:1px solid #e1e3e4">${pct}%</td>
                    <td style="padding:6px 8px;text-align:center;border-bottom:1px solid #e1e3e4">${a.required}%</td>
                </tr>`;
            }).join('');

            // Notes summary
            const notesSummary = folders.map(f =>
                `<div style="margin-bottom:14px">
                    <p style="font-weight:700;color:#15157d;margin:0 0 4px">📁 ${f.name}</p>
                    ${f.notes.map(n => `<p style="margin:2px 0 2px 12px;font-size:12px">• <strong>${n.title}</strong>: ${n.content.substring(0,80)}${n.content.length>80?'...':''}</p>`).join('')}
                </div>`
            ).join('');

            const sectionHdr = (t) => `<h2 style="font-size:16px;font-weight:800;color:#15157d;margin:24px 0 10px;border-bottom:2px solid #e1e0ff;padding-bottom:4px">${t}</h2>`;
            const thStyle    = 'padding:8px;text-align:left;background:#15157d;color:#fff;font-size:12px';

            printHTML(`
                ${headerBlock('Full Academic Report')}
                ${sectionHdr('📅 Timetable')}
                <table style="width:100%;border-collapse:collapse;font-size:12px;">
                    <thead><tr><th style="${thStyle}">Day</th><th style="${thStyle}">Subject</th><th style="${thStyle}">Time</th></tr></thead>
                    <tbody>${ttRows || '<tr><td colspan="3" style="padding:8px;color:#777683">No classes added.</td></tr>'}</tbody>
                </table>
                ${sectionHdr('📊 Attendance Report')}
                <table style="width:100%;border-collapse:collapse;font-size:12px;">
                    <thead><tr><th style="${thStyle}">Subject</th><th style="${thStyle};text-align:center">Attended</th><th style="${thStyle};text-align:center">%</th><th style="${thStyle};text-align:center">Min</th></tr></thead>
                    <tbody>${attRows || '<tr><td colspan="4" style="padding:8px;color:#777683">No attendance logged.</td></tr>'}</tbody>
                </table>
                ${sectionHdr('📝 Notes Summary')}
                ${notesSummary || '<p style="font-size:12px;color:#777683">No notes added.</p>'}
            `);
        }
    </script>
</body>
</html>
